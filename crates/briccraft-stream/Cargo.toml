[package]
name = "briccraft-stream"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic signed-coordinate terrain streaming, sparse edits, and global construction history"

[dependencies]
briccraft-parts = { path = "../briccraft-parts" }
briccraft-world = { path = "../briccraft-world" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
